<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-labelledby="tt dd">
<title id="tt">tri terminal</title>
<desc id="dd">A terminal window typing out tri's identity, stack and activity.</desc>
<defs>
<clipPath id="win"><rect width="980" height="300" rx="14"/></clipPath>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FF00F6"/><stop offset=".5" stop-color="#7C3AED"/>
  <stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
  <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4b1fa8" flood-opacity=".42"/>
</filter>
<filter id="blinkglow" x="-300%" y="-300%" width="700%" height="700%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="c0"><rect x="30" y="60.0" width="0" height="28.0"><animate attributeName="width" from="0" to="83" dur="0.30s" begin="0.60s" fill="freeze"/></rect></clipPath><clipPath id="c1"><rect x="30" y="91.0" width="0" height="28.0"><animate attributeName="width" from="0" to="410" dur="1.01s" begin="1.25s" fill="freeze"/></rect></clipPath><clipPath id="c2"><rect x="30" y="122.0" width="0" height="28.0"><animate attributeName="width" from="0" to="150" dur="0.36s" begin="2.56s" fill="freeze"/></rect></clipPath><clipPath id="c3"><rect x="30" y="153.0" width="0" height="28.0"><animate attributeName="width" from="0" to="602" dur="1.49s" begin="3.72s" fill="freeze"/></rect></clipPath><clipPath id="c4"><rect x="30" y="184.0" width="0" height="28.0"><animate attributeName="width" from="0" to="169" dur="0.41s" begin="5.81s" fill="freeze"/></rect></clipPath><clipPath id="c5"><rect x="30" y="215.0" width="0" height="28.0"><animate attributeName="width" from="0" to="583" dur="1.44s" begin="6.56s" fill="freeze"/></rect></clipPath><clipPath id="c6"><rect x="30" y="246.0" width="0" height="28.0"><animate attributeName="width" from="0" to="25" dur="0.30s" begin="8.15s" fill="freeze"/></rect></clipPath>
</defs>

<g filter="url(#shadow)"><rect width="980" height="300" rx="14" fill="#0e0918"/></g>
<g clip-path="url(#win)">
  <rect width="980" height="44" fill="#1b1230"/>
  <rect width="980" height="44" fill="url(#glass)"/>
  <rect y="43" width="980" height="1" fill="url(#hair)" opacity=".55"/>
</g>
<rect width="980" height="300" rx="14" fill="none" stroke="url(#hair)" stroke-opacity=".38"/>
<circle cx="30" cy="22" r="6" fill="#ff5f57"/><circle cx="52" cy="22" r="6" fill="#febc2e"/><circle cx="74" cy="22" r="6" fill="#28c840"/>
<text x="490.0" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8d7ab8">tri@github: ~ &#8212; zsh</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" xml:space="preserve">
<g clip-path="url(#c0)"><text x="30" y="76" font-size="16" fill="#e9e2ff">$ whoami</text></g><g clip-path="url(#c1)"><text x="30" y="107" font-size="16" fill="#bfa9f5">tri — python · go · js · backend developer</text></g><g clip-path="url(#c2)"><text x="30" y="138" font-size="16" fill="#e9e2ff">$ cat stack.txt</text></g><g clip-path="url(#c3)"><text x="30" y="169" font-size="16" fill="#bfa9f5">python  go  javascript  typescript  react  node  docker  linux</text></g><g clip-path="url(#c4)"><text x="30" y="200" font-size="16" fill="#e9e2ff">$ ./status --long</text></g><g clip-path="url(#c5)"><text x="30" y="231" font-size="16" fill="#22D3EE">507 contributions in the last 12 months · Bangladesh · UTC+6</text></g><g clip-path="url(#c6)"><text x="30" y="262" font-size="16" fill="#e9e2ff">$ </text></g>
<rect x="55" y="247" width="10" height="19" fill="#FF00F6" filter="url(#blinkglow)">
  <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" begin="8.75s" repeatCount="indefinite"/>
</rect>
</g>
</svg>
